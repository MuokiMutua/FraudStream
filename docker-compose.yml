
services:
  # 1. Apache Kafka (KRaft Mode - The Streaming Nervous System)
  kafka:
    image: apache/kafka:3.7.0
    container_name: mpesa_kafka_broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # 1b. Kafka Visual UI (AKHQ)
  akhq:
    image: tchiotludo/akhq:0.25.0
    container_name: mpesa_kafka_ui
    ports:
      - "8080:8080"
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            local-kraft-cluster:
              properties:
                bootstrap.servers: "kafka:9092"
    depends_on:
      - kafka

  # 2. PostgreSQL (Relational ML Feature Store)
  postgres:
    image: postgres:15-alpine
    container_name: mpesa_feature_store
    environment:
      POSTGRES_USER: risk_admin
      POSTGRES_PASSWORD: RiskPassword2026
      POSTGRES_DB: mobile_money_profiles
    ports:
      - "5433:5432"
    volumes:
      - pg_risk_data:/var/lib/postgresql/data

  # 2b. PostgreSQL Visual UI (pgAdmin)
  pgadmin:
    image: dpage/pgadmin4:8.5
    container_name: mpesa_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: risk@mpesa.ke
      PGADMIN_DEFAULT_PASSWORD: WebAdminPassword2026
    ports:
      - "5050:5050"
    depends_on:
      - postgres

  # 3. MongoDB (NoSQL Raw Transaction & Score Audit Log)
  mongodb:
    image: mongo:6.0
    container_name: mpesa_audit_lake
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_risk_admin
      MONGO_INITDB_ROOT_PASSWORD: MongoPassword2026
    ports:
      - "27017:27017"
    volumes:
      - mongo_risk_data:/data/db

  # 3b. MongoDB Visual UI (Mongo Express)
  mongo-express:
    image: mongo-express:1.0.0-alpha.4
    container_name: mpesa_mongo_ui
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: mongo_risk_admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: MongoPassword2026
      ME_CONFIG_MONGODB_URL: mongodb://mongo_risk_admin:MongoPassword2026@mongodb:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: risk
      ME_CONFIG_BASICAUTH_PASSWORD: WebAdminPassword2026
    ports:
      - "8081:8081"
    depends_on:
      - mongodb

  # 4. Grafana (Real-Time Alerting Dashboard)
  grafana:
    image: grafana/grafana-oss:latest
    container_name: mpesa_alert_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=AdminGrafana2026
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  pg_risk_data:
  mongo_risk_data:
  grafana_data: